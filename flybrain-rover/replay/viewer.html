<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyBrain Rover Replay Viewer</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-panel: #101010;
    --line: #232323;
    --text: #e8e8e8;
    --dim: #8a8a8a;
    --accent: #FF715B;
    --eye: #4da6ff;
    --dope: #e8c34d;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* header */
  #header {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 18px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-panel);
  }
  #load-row { display: flex; align-items: center; gap: 8px; }
  #load-row .title { color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
  .file-label {
    border: 1px solid var(--line);
    color: var(--text);
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
  }
  .file-label:hover { border-color: var(--accent); color: var(--accent); }
  #file-input { display: none; }
  #meta-bar { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11.5px; color: var(--dim); }
  #meta-bar .meta-item b { color: var(--text); font-weight: 500; }
  #meta-bar.hidden, #drop-empty-hint { display: none; }
  #meta-bar:empty { display: none; }

  /* main split */
  #main { flex: 1 1 auto; display: flex; min-height: 0; min-width: 0; }
  #left-panel {
    flex: 1 1 62%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    padding: 10px;
  }
  #arena-canvas { display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }

  #right-panel {
    flex: 0 1 380px;
    max-width: 44%;
    min-width: 240px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--line);
    background: var(--bg-panel);
    padding: 10px;
    gap: 8px;
    overflow: hidden;
  }
  .panel-label { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 0 -2px 2px; }
  #bars-canvas { flex: 1 1 46%; width: 100%; min-height: 0; }
  #raster-canvas { flex: 0 0 150px; width: 100%; }
  #readout {
    flex: 0 0 auto;
    max-height: 34%;
    overflow-y: auto;
    font-size: 11.5px;
    line-height: 1.6;
    padding-top: 2px;
    border-top: 1px solid var(--line);
  }
  .readout-row { display: flex; justify-content: space-between; gap: 10px; color: var(--dim); }
  .readout-row b { color: var(--text); font-weight: 500; }
  .readout-row.accent b { color: var(--accent); }

  /* timeline */
  #timeline {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-top: 1px solid var(--line);
    background: var(--bg-panel);
    font-size: 12px;
  }
  #play-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    min-width: 58px;
  }
  #play-btn:disabled { opacity: 0.35; cursor: default; border-color: var(--line); color: var(--dim); }
  #play-btn:not(:disabled):hover { background: rgba(255,113,91,0.12); }
  #scrub { flex: 1 1 auto; accent-color: var(--accent); }
  #frame-counter { color: var(--dim); min-width: 96px; text-align: right; }
  #speed-group { display: flex; gap: 4px; }
  #speed-group button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11.5px;
  }
  #speed-group button.active { border-color: var(--accent); color: var(--accent); }
  #speed-group button:disabled { opacity: 0.35; cursor: default; }
  #hint { color: var(--line); font-size: 10.5px; margin-left: auto; }

  #drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.85);
    border: 2px dashed var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--accent);
    z-index: 50;
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }

  @media (max-width: 780px) {
    #main { flex-direction: column; }
    #left-panel { flex: 1 1 50%; }
    #right-panel { flex: 1 1 50%; max-width: 100%; border-left: none; border-top: 1px solid var(--line); }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="load-row">
      <span class="title">FLYBRAIN REPLAY</span>
      <label class="file-label" for="file-input">open file&hellip;</label>
      <input type="file" id="file-input" accept=".json,application/json">
      <span id="drop-empty-hint" style="color:var(--dim); font-size:11.5px;">or drag a replay .json anywhere on this page</span>
    </div>
    <div id="meta-bar"></div>
  </div>

  <div id="main">
    <div id="left-panel">
      <canvas id="arena-canvas" width="600" height="600"></canvas>
    </div>
    <div id="right-panel">
      <div class="panel-label">neuron group rates (Hz)</div>
      <canvas id="bars-canvas"></canvas>
      <div class="panel-label">spike raster (512 sampled)</div>
      <canvas id="raster-canvas"></canvas>
      <div id="readout"></div>
    </div>
  </div>

  <div id="timeline">
    <button id="play-btn" disabled>Play</button>
    <input type="range" id="scrub" min="0" max="0" value="0" step="1" disabled>
    <span id="frame-counter">0 / 0</span>
    <div id="speed-group">
      <button data-speed="0.5" disabled>0.5x</button>
      <button data-speed="1" class="active" disabled>1x</button>
      <button data-speed="2" disabled>2x</button>
    </div>
    <span id="hint">space play/pause &middot; &larr;&rarr; step</span>
  </div>
</div>
<div id="drop-overlay">drop replay JSON to load</div>

<script>
(function () {
  "use strict";

  var DPR = Math.max(1, window.devicePixelRatio || 1);

  var BAR_KEYS = [
    "LC10a_L", "LC10a_R", "LC11_L", "LC11_R", "LC4_L", "LC4_R",
    "DNa02_L", "DNa02_R", "DNa01_L", "DNa01_R", "DNp09", "GF",
    "PAM", "PPL1", "DN_ALL"
  ];

  var HFOV_DEG = 98.43;
  var HALF_FOV_DEG = HFOV_DEG / 2; // 49.215
  var N_COLS = 24;
  var FOV_LEN = 3.0; // metres, rendering length of the camera wedge
  var TRAIL_LEN = 100;
  var RASTER_COLS = 32;
  var RASTER_ROWS = 16;
  var RASTER_N = RASTER_COLS * RASTER_ROWS; // 512
  var SPIKE_FADE = 3; // frames

  // ---- state ----
  var episode = null;
  var currentFileName = "";
  var frameIdx = 0;
  var playing = false;
  var speed = 1;
  var acc = 0;
  var lastTs = null;

  // ---- dom ----
  var fileInput = document.getElementById("file-input");
  var metaBar = document.getElementById("meta-bar");
  var leftPanel = document.getElementById("left-panel");
  var arenaCanvas = document.getElementById("arena-canvas");
  var barsCanvas = document.getElementById("bars-canvas");
  var rasterCanvas = document.getElementById("raster-canvas");
  var readoutEl = document.getElementById("readout");
  var playBtn = document.getElementById("play-btn");
  var scrub = document.getElementById("scrub");
  var frameCounter = document.getElementById("frame-counter");
  var speedButtons = Array.prototype.slice.call(document.querySelectorAll("#speed-group button"));
  var dropOverlay = document.getElementById("drop-overlay");

  var arenaCtx = arenaCanvas.getContext("2d");
  var barsCtx = barsCanvas.getContext("2d");
  var rasterCtx = rasterCanvas.getContext("2d");

  var arenaSize = { w: 0, h: 0 };
  var barsSize = { w: 0, h: 0 };
  var rasterSize = { w: 0, h: 0 };

  // ---------------------------------------------------------------------
  // file loading
  // ---------------------------------------------------------------------
  function loadFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var data;
      try {
        data = JSON.parse(e.target.result);
      } catch (err) {
        window.alert("Could not parse " + file.name + " as JSON: " + err.message);
        return;
      }
      if (!data || !data.meta || !Array.isArray(data.frames)) {
        window.alert(file.name + " does not look like a replay file (missing meta/frames).");
        return;
      }
      currentFileName = file.name || "(dropped file)";
      initEpisode(data);
    };
    reader.onerror = function () {
      window.alert("Could not read " + file.name);
    };
    reader.readAsText(file);
  }

  function initEpisode(data) {
    episode = data;
    frameIdx = 0;
    acc = 0;
    lastTs = null;
    setPlaying(false);

    var n = episode.frames.length;
    scrub.min = 0;
    scrub.max = Math.max(0, n - 1);
    scrub.value = 0;
    scrub.disabled = n <= 1;
    playBtn.disabled = n === 0;
    speedButtons.forEach(function (b) { b.disabled = n === 0; });

    updateMetaBar();
    resizeAll();
    render();
  }

  function fmtNum(v, digits) {
    if (typeof v !== "number" || !isFinite(v)) return String(v);
    return v.toFixed(digits === undefined ? 2 : digits);
  }

  function updateMetaBar() {
    if (!episode) { metaBar.replaceChildren(); return; }
    var m = episode.meta || {};
    var rows = [];
    rows.push(["file", currentFileName]);
    if (m.brain !== undefined) rows.push(["brain", m.brain]);
    rows.push(["checkpoint", (m.checkpoint === null || m.checkpoint === undefined || m.checkpoint === "") ? "(none)" : m.checkpoint]);
    var lesion = m.lesion;
    rows.push(["lesion", (Array.isArray(lesion) && lesion.length) ? lesion.join(",") : "(none)"]);
    if (m.seed !== undefined) rows.push(["seed", m.seed]);
    if (m.stage !== undefined) rows.push(["stage", m.stage]);
    if (m.summary) {
      if (typeof m.summary.contact_rate === "number") rows.push(["contact_rate", (m.summary.contact_rate * 100).toFixed(0) + "%"]);
      if (typeof m.summary.forward_mean === "number") rows.push(["forward_mean", fmtNum(m.summary.forward_mean, 3)]);
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (kv) {
      var span = document.createElement("span");
      span.className = "meta-item";
      var b = document.createElement("b");
      b.textContent = String(kv[1]);
      span.appendChild(document.createTextNode(kv[0] + ": "));
      span.appendChild(b);
      frag.appendChild(span);
    });
    metaBar.replaceChildren(frag);
  }

  // ---------------------------------------------------------------------
  // canvas sizing
  // ---------------------------------------------------------------------
  function fitCanvas(canvas) {
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    var ctx = canvas.getContext("2d");
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    return { w: w, h: h };
  }

  function layoutArenaCanvas() {
    var w = leftPanel.clientWidth - 20; // account for panel padding
    var h = leftPanel.clientHeight - 20;
    var side = Math.max(50, Math.min(w, h));
    arenaCanvas.style.width = side + "px";
    arenaCanvas.style.height = side + "px";
  }

  function resizeAll() {
    layoutArenaCanvas();
    arenaSize = fitCanvas(arenaCanvas);
    barsSize = fitCanvas(barsCanvas);
    rasterSize = fitCanvas(rasterCanvas);
    render();
  }

  // ---------------------------------------------------------------------
  // arena rendering
  // ---------------------------------------------------------------------
  function drawEmptyArena() {
    var w = arenaSize.w, h = arenaSize.h;
    arenaCtx.clearRect(0, 0, w, h);
    arenaCtx.fillStyle = "#0a0a0a";
    arenaCtx.fillRect(0, 0, w, h);
    arenaCtx.fillStyle = "#3a3a3a";
    arenaCtx.font = "12px ui-monospace, monospace";
    arenaCtx.textAlign = "center";
    arenaCtx.textBaseline = "middle";
    arenaCtx.fillText("load a replay JSON to begin", w / 2, h / 2);
  }

  function drawArena(frame) {
    var w = arenaSize.w, h = arenaSize.h;
    var ctx = arenaCtx;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0, 0, w, h);

    var L = (episode.meta && episode.meta.arena_L) || 6.0;
    var pad = 0.9;
    var scale = (Math.min(w, h) / L) * pad;
    var cx0 = w / 2, cy0 = h / 2;

    function w2c(x, y) {
      return [cx0 + x * scale, cy0 - y * scale];
    }

    // walls
    var p0 = w2c(-L / 2, L / 2);
    var p1 = w2c(L / 2, -L / 2);
    ctx.strokeStyle = "#333333";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(p0[0], p0[1], p1[0] - p0[0], p1[1] - p0[1]);

    // trail (fading)
    var trailStart = Math.max(0, frameIdx - (TRAIL_LEN - 1));
    var span = Math.max(1, frameIdx - trailStart);
    for (var i = trailStart; i <= frameIdx; i++) {
      var fr = episode.frames[i];
      if (!fr || !fr.rxy) continue;
      var pc = w2c(fr.rxy[0], fr.rxy[1]);
      var t = (i - trailStart) / span;
      ctx.beginPath();
      ctx.arc(pc[0], pc[1], 1.6, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,113,91," + (0.04 + 0.4 * t).toFixed(3) + ")";
      ctx.fill();
    }

    drawFovAndColumns(ctx, w2c, frame);
    drawHumans(ctx, w2c, scale, frame);
    drawRover(ctx, w2c, frame);
  }

  function drawFovAndColumns(ctx, w2c, frame) {
    if (!frame.rxy || typeof frame.ryaw !== "number") return;
    var rx = frame.rxy[0], ry = frame.rxy[1];
    var yaw = frame.ryaw;
    var pres = frame.pres;

    function pointAt(azDeg, radius) {
      var worldAngle = yaw - (azDeg * Math.PI / 180);
      var x = rx + radius * Math.cos(worldAngle);
      var y = ry + radius * Math.sin(worldAngle);
      return w2c(x, y);
    }

    var center = w2c(rx, ry);

    // translucent full wedge outline
    ctx.beginPath();
    ctx.moveTo(center[0], center[1]);
    var edgeSteps = 24;
    for (var s = 0; s <= edgeSteps; s++) {
      var az = -HALF_FOV_DEG + (HFOV_DEG * s / edgeSteps);
      var p = pointAt(az, FOV_LEN);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(255,113,91,0.05)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,113,91,0.3)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // 24 retina columns, opacity = pres[c]; column 0 = left edge (-49.2deg)
    if (Array.isArray(pres)) {
      var colW = HFOV_DEG / N_COLS;
      for (var c = 0; c < N_COLS; c++) {
        var val = pres[c];
        if (typeof val !== "number") continue;
        var frac = Math.max(0, Math.min(1, val));
        if (frac <= 0.004) continue;
        var azStart = -HALF_FOV_DEG + c * colW;
        var azEnd = azStart + colW;
        ctx.beginPath();
        ctx.moveTo(center[0], center[1]);
        var sub = 3;
        for (var k = 0; k <= sub; k++) {
          var a = azStart + (azEnd - azStart) * (k / sub);
          var pp = pointAt(a, FOV_LEN);
          ctx.lineTo(pp[0], pp[1]);
        }
        ctx.closePath();
        ctx.fillStyle = "rgba(77,166,255," + (frac * 0.85).toFixed(3) + ")";
        ctx.fill();
      }
    }
  }

  function drawHumans(ctx, w2c, scale, frame) {
    var hxy = frame.hxy, hr = frame.hr;
    if (!Array.isArray(hxy)) return;
    for (var k = 0; k < hxy.length; k++) {
      var pt = hxy[k];
      if (!pt) continue;
      var c = w2c(pt[0], pt[1]);
      var r = ((Array.isArray(hr) && typeof hr[k] === "number") ? hr[k] : 0.2) * scale;
      ctx.beginPath();
      ctx.arc(c[0], c[1], Math.max(1, r), 0, Math.PI * 2);
      ctx.fillStyle = "rgba(232,232,232,0.22)";
      ctx.strokeStyle = "rgba(232,232,232,0.85)";
      ctx.lineWidth = 1.3;
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawRover(ctx, w2c, frame) {
    if (!frame.rxy || typeof frame.ryaw !== "number") return;
    var rx = frame.rxy[0], ry = frame.rxy[1];
    var yaw = frame.ryaw;
    var lw = (episode.meta && episode.meta.rover_lw) || [0.32, 0.17];
    var hl = lw[0] / 2, hw = lw[1] / 2;
    var front = 0.06;
    var cos = Math.cos(yaw), sin = Math.sin(yaw);

    function local(lx, ly) {
      var x = rx + lx * cos - ly * sin;
      var y = ry + lx * sin + ly * cos;
      return w2c(x, y);
    }

    var body = [local(hl, hw), local(hl, -hw), local(-hl, -hw), local(-hl, hw)];
    ctx.beginPath();
    ctx.moveTo(body[0][0], body[0][1]);
    for (var i = 1; i < body.length; i++) ctx.lineTo(body[i][0], body[i][1]);
    ctx.closePath();
    ctx.fillStyle = "rgba(232,232,232,0.85)";
    ctx.strokeStyle = "#e8e8e8";
    ctx.lineWidth = 1.4;
    ctx.fill();
    ctx.stroke();

    var strip = [local(hl, hw), local(hl, -hw), local(hl - front, -hw), local(hl - front, hw)];
    ctx.beginPath();
    ctx.moveTo(strip[0][0], strip[0][1]);
    for (var j = 1; j < strip.length; j++) ctx.lineTo(strip[j][0], strip[j][1]);
    ctx.closePath();
    ctx.fillStyle = "#FF715B";
    ctx.fill();
  }

  // ---------------------------------------------------------------------
  // bar chart
  // ---------------------------------------------------------------------
  function barColor(key) {
    if (key.indexOf("LC") === 0) return "#4da6ff";
    if (key === "PAM" || key === "PPL1") return "#e8c34d";
    return "#FF715B"; // DN*, GF, DN_ALL
  }

  function drawBars(frame) {
    var w = barsSize.w, h = barsSize.h;
    var ctx = barsCtx;
    ctx.clearRect(0, 0, w, h);
    if (w < 10 || h < 10) return;

    var rates = frame.rates || {};
    var present = BAR_KEYS.filter(function (k) { return typeof rates[k] === "number"; });
    if (present.length === 0) {
      ctx.fillStyle = "#555";
      ctx.font = "11px ui-monospace, monospace";
      ctx.fillText("no rate data", 6, 14);
      return;
    }

    var maxHz = 200;
    var marginL = 62, marginR = 40, marginT = 4, marginB = 4;
    var plotW = Math.max(10, w - marginL - marginR);
    var plotH = Math.max(10, h - marginT - marginB);
    var n = present.length;
    var barH = plotH / n;
    var bh = Math.max(2, Math.min(barH * 0.62, 16));

    ctx.textBaseline = "middle";
    ctx.font = "10.5px ui-monospace, monospace";

    // faint gridlines at 50/100/150 Hz
    ctx.strokeStyle = "#1c1c1c";
    ctx.lineWidth = 1;
    [50, 100, 150].forEach(function (g) {
      var gx = marginL + plotW * (g / maxHz);
      ctx.beginPath();
      ctx.moveTo(gx, marginT);
      ctx.lineTo(gx, marginT + plotH);
      ctx.stroke();
    });

    present.forEach(function (key, i) {
      var val = Math.max(0, rates[key]);
      var frac = Math.min(1, val / maxHz);
      var y = marginT + i * barH;
      var by = y + (barH - bh) / 2;

      ctx.fillStyle = "#181818";
      ctx.fillRect(marginL, by, plotW, bh);

      ctx.fillStyle = barColor(key);
      ctx.fillRect(marginL, by, plotW * frac, bh);

      ctx.fillStyle = "#c8c8c8";
      ctx.textAlign = "right";
      ctx.fillText(key, marginL - 6, y + barH / 2);

      ctx.fillStyle = "#888";
      ctx.textAlign = "left";
      ctx.fillText(val.toFixed(0), marginL + plotW + 4, y + barH / 2);
    });

    // 200 Hz marker (right edge of scale)
    var markerX = marginL + plotW;
    ctx.strokeStyle = "#555";
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(markerX, marginT);
    ctx.lineTo(markerX, marginT + plotH);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#555";
    ctx.textAlign = "left";
    ctx.font = "9.5px ui-monospace, monospace";
    ctx.fillText("200", markerX + 4, marginT - 2 < 6 ? 8 : marginT);
  }

  // ---------------------------------------------------------------------
  // spike raster
  // ---------------------------------------------------------------------
  function drawRaster(idx) {
    var w = rasterSize.w, h = rasterSize.h;
    var ctx = rasterCtx;
    ctx.clearRect(0, 0, w, h);
    if (!episode) return;

    var vizN = (episode.meta && Array.isArray(episode.meta.viz_neurons)) ? episode.meta.viz_neurons.length : RASTER_N;
    var n = Math.min(RASTER_N, vizN);

    var sets = [];
    for (var back = 0; back <= SPIKE_FADE; back++) {
      var fi = idx - back;
      var fr = (fi >= 0) ? episode.frames[fi] : null;
      sets.push((fr && Array.isArray(fr.spikes)) ? new Set(fr.spikes) : null);
    }

    var cellW = w / RASTER_COLS, cellH = h / RASTER_ROWS;
    var r = Math.max(0.8, Math.min(cellW, cellH) * 0.32);

    for (var i = 0; i < n; i++) {
      var age = SPIKE_FADE + 1;
      for (var b = 0; b <= SPIKE_FADE; b++) {
        if (sets[b] && sets[b].has(i)) { age = b; break; }
      }
      var col = i % RASTER_COLS, row = (i / RASTER_COLS) | 0;
      var cx = cellW * (col + 0.5), cy = cellH * (row + 0.5);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (age > SPIKE_FADE) {
        ctx.fillStyle = "rgba(232,232,232,0.08)";
      } else {
        var alpha = 1 - age / (SPIKE_FADE + 0.5);
        ctx.fillStyle = "rgba(255,113,91," + alpha.toFixed(2) + ")";
      }
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------------
  // readout
  // ---------------------------------------------------------------------
  function addReadoutRow(frag, label, value, accent) {
    var row = document.createElement("div");
    row.className = "readout-row" + (accent ? " accent" : "");
    var l = document.createElement("span");
    l.textContent = label;
    var v = document.createElement("b");
    v.textContent = value;
    row.appendChild(l);
    row.appendChild(v);
    frag.appendChild(row);
  }

  function drawReadout(frame) {
    var frag = document.createDocumentFragment();
    if (typeof frame.t === "number") addReadoutRow(frag, "t", fmtNum(frame.t, 2) + " s");
    if (typeof frame.forward === "number") addReadoutRow(frag, "forward", fmtNum(frame.forward, 3));
    if (typeof frame.turn === "number") {
      var arrow = frame.turn > 0.02 ? "→" : (frame.turn < -0.02 ? "←" : "·");
      addReadoutRow(frag, "turn", fmtNum(frame.turn, 3) + " " + arrow);
    }
    if (typeof frame.reward === "number") addReadoutRow(frag, "reward", fmtNum(frame.reward, 2), frame.reward !== 0);
    if (Array.isArray(frame.heat) && frame.heat.length >= 2) {
      addReadoutRow(frag, "heat L/R", fmtNum(frame.heat[0], 2) + " / " + fmtNum(frame.heat[1], 2));
    }
    if (Array.isArray(frame.loom) && frame.loom.length >= 2) {
      addReadoutRow(frag, "loom L/R", fmtNum(frame.loom[0], 2) + " / " + fmtNum(frame.loom[1], 2));
    }
    var summary = episode.meta && episode.meta.summary;
    if (summary && typeof summary.contact_rate === "number") {
      addReadoutRow(frag, "contact_rate", (summary.contact_rate * 100).toFixed(0) + "%");
    }
    readoutEl.replaceChildren(frag);
  }

  // ---------------------------------------------------------------------
  // top-level render
  // ---------------------------------------------------------------------
  function render() {
    if (!episode || episode.frames.length === 0) {
      drawEmptyArena();
      barsCtx.clearRect(0, 0, barsSize.w, barsSize.h);
      rasterCtx.clearRect(0, 0, rasterSize.w, rasterSize.h);
      readoutEl.replaceChildren();
      frameCounter.textContent = "0 / 0";
      return;
    }
    var frame = episode.frames[frameIdx];
    drawArena(frame);
    drawBars(frame);
    drawRaster(frameIdx);
    drawReadout(frame);
    frameCounter.textContent = (frameIdx + 1) + " / " + episode.frames.length;
    scrub.value = frameIdx;
  }

  // ---------------------------------------------------------------------
  // playback loop
  // ---------------------------------------------------------------------
  function setPlaying(v) {
    playing = !!v;
    playBtn.textContent = playing ? "Pause" : "Play";
  }

  function tick(ts) {
    window.requestAnimationFrame(tick);
    if (!episode || !playing || episode.frames.length === 0) { lastTs = null; return; }
    if (lastTs === null) { lastTs = ts; return; }
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.25) dt = 0.25; // clamp after tab-switch / stall
    acc += dt * speed;
    var frameDt = (episode.meta && episode.meta.dt) || 0.02;
    var steps = 0;
    var looped = false;
    while (acc >= frameDt && steps < 400) {
      acc -= frameDt;
      frameIdx++;
      steps++;
      if (frameIdx >= episode.frames.length) {
        frameIdx = 0;
        looped = true;
      }
    }
    if (looped) acc = 0;
    if (steps > 0) render();
  }
  window.requestAnimationFrame(tick);

  // ---------------------------------------------------------------------
  // controls
  // ---------------------------------------------------------------------
  playBtn.addEventListener("click", function () {
    if (!episode || episode.frames.length === 0) return;
    setPlaying(!playing);
  });

  scrub.addEventListener("input", function () {
    if (!episode) return;
    setPlaying(false);
    frameIdx = Math.max(0, Math.min(episode.frames.length - 1, parseInt(scrub.value, 10) || 0));
    render();
  });

  speedButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      speed = parseFloat(btn.getAttribute("data-speed"));
      speedButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
    });
  });

  window.addEventListener("keydown", function (e) {
    if (!episode || episode.frames.length === 0) return;
    if (e.code === "Space") {
      e.preventDefault();
      setPlaying(!playing);
    } else if (e.code === "ArrowLeft") {
      e.preventDefault();
      setPlaying(false);
      frameIdx = Math.max(0, frameIdx - 1);
      render();
    } else if (e.code === "ArrowRight") {
      e.preventDefault();
      setPlaying(false);
      frameIdx = Math.min(episode.frames.length - 1, frameIdx + 1);
      render();
    }
  });

  fileInput.addEventListener("change", function (e) {
    if (e.target.files && e.target.files.length) loadFile(e.target.files[0]);
  });

  var dragDepth = 0;
  window.addEventListener("dragenter", function (e) {
    e.preventDefault();
    dragDepth++;
    dropOverlay.classList.add("show");
  });
  window.addEventListener("dragover", function (e) {
    e.preventDefault();
  });
  window.addEventListener("dragleave", function (e) {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropOverlay.classList.remove("show");
  });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove("show");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      loadFile(e.dataTransfer.files[0]);
    }
  });

  window.addEventListener("resize", resizeAll);

  // ---------------------------------------------------------------------
  // init
  // ---------------------------------------------------------------------
  resizeAll();
  render();
})();
</script>
</body>
</html>
