; ESP32 DevKit V1 as an S-Bus inverter for the RoboMaster S1: the Pi sends S-Bus frames down the
; USB cable (100000 baud 8E2, as it would to the S-Bus pin), the ESP32 re-emits them inverted on
; GPIO17. If the frames stop, it centres the sticks itself. See docs/wiring.md, "RoboMaster S1".
[env:sbus-bridge]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
