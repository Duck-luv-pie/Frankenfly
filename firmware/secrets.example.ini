; Copy to firmware/secrets.ini (git-ignored) and fill in your WiFi network.
[secrets]
build_flags =
    -DWIFI_SSID=\"your-network\"
    -DWIFI_PASS=\"your-password\"
    ; optional extra networks for the camera (a phone hotspot, the Pi's hotspot); quote a name with spaces:
    ; '-DWIFI_SSID2="My Phone"'
    ; -DWIFI_PASS2=\"...\"
