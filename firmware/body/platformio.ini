; ESP32 DevKit V1 -- the Companion "body": two GC9A01 eyes, DFPlayer Mini audio, HC-SR501 PIR,
; UDP link to the brain. Pins are in include/config.h.
[platformio]
extra_configs = ../secrets.ini

[env:body]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    dfrobot/DFRobotDFPlayerMini@1.0.6
    bblanchon/ArduinoJson@7.2.1
build_flags =
    ${secrets.build_flags}
    -DCORE_DEBUG_LEVEL=1
