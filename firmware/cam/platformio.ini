; ESP32-CAM (AI-Thinker) -- MJPEG stream server for the Companion brain.
; Flash: hold IO0, tap RST, release IO0, `pio run -t upload`, tap RST.
[platformio]
extra_configs = ../secrets.ini

[env:cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    ${secrets.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
