[project]
name = "companion-brain"
version = "0.1.0"
description = "Real-time FlyWire connectome simulation that drives the Companion robot"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "opencv-python-headless>=4.9",
    "requests>=2.31",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
s1 = ["pyserial>=3.5"]
gpu = [
    "torch>=2.2",
]
# The relay and the outbound publisher import `websockets` lazily, inside serve_forever / the publish
# thread, so every test passes with it absent (they inject fakes). Nothing declared it, which meant the
# first person to actually run the relay would hit ImportError with no clue where to look. Optional, not
# required: neither the sim nor the robot needs it.
relay = ["websockets>=12"]

[project.scripts]
companion = "companion_brain.main:main"
# relay/server.py's argparse already calls itself "companion-relay"; it just was not installable under
# that name, so the only way to start it was `python -m companion_brain.relay.server`.
companion-relay = "companion_brain.relay.server:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Linux Arm (the Raspberry Pi): PyPI's torch wheel is the CUDA build with gigabytes of NVIDIA packages; use the CPU build
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
