[project]
name = "companion-brain"
version = "0.1.0"
description = "Real-time FlyWire connectome simulation that drives the Companion robot"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "opencv-python-headless>=4.9",
    "requests>=2.31",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
s1 = ["pyserial>=3.5"]
gpu = [
    "torch>=2.2",
]

[project.scripts]
companion = "companion_brain.main:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
