# Companion brain configuration.
# Everything the robot does is a mapping between real FlyWire neuron groups and sensors/actuators.
# Neuron groups are selected from the FlyWire annotations (Schlegel et al. 2024) by cell_type,
# regex, or neurotransmitter. Left/right are resolved automatically from the `side` column.

data:
  raw_dir: data/raw
  cache_dir: data/cache
  atlas_dir: data/atlas/male-cns   # MaleCNS neuron atlas (Fly / Neural Atlas export: manifest.json, catalog.json.gz, skeletons-*.bin.gz)
  files:
    connectivity:
      url: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Connectivity_783.parquet
      name: Connectivity_783.parquet
      size: 100804642
    completeness:
      url: https://raw.githubusercontent.com/philshiu/Drosophila_brain_model/main/Completeness_783.csv
      name: Completeness_783.csv
      size: 3327347
    annotations:
      url: https://raw.githubusercontent.com/flyconnectome/flywire_annotations/main/supplemental_files/Supplemental_file1_neuron_annotations.tsv
      name: neuron_annotations.tsv

# Leaky integrate-and-fire parameters (Shiu et al. 2024, model.py defaults).
lif:
  v_rest_mv: -52.0
  v_reset_mv: -52.0
  v_thresh_mv: -45.0
  tau_mem_ms: 20.0
  tau_syn_ms: 5.0
  refractory_ms: 2.2
  delay_ms: 1.8
  w_syn_mv: 0.275
  dt_ms: 0.1
  min_synapses: 5          # connections weaker than this are dropped (as in Shiu et al.)
  adapt_mv: 2.0            # spike-frequency adaptation per spike (0 = reference model); tames runaway excitatory loops
                           # (5 mV also kills the polysynaptic sugar -> proboscis pathway; 2 mV keeps it)
  tau_adapt_ms: 200
  depress_u: 0.0           # short-term synaptic depression per presynaptic spike (optional brake; 0.05 silences the sugar pathway)
  tau_depress_ms: 200
  background_hz: 1.0       # spontaneous firing floor (0 = silent brain, as in the paper) ...
  background_classes: [central, descending, ascending, visual_centrifugal, endocrine]   # ... for these neurons only;
                           # sensory and visual projection neurons fire only when the senses drive them

# Circuit pruning: keep neurons on paths from inputs to readouts.
prune:
  hops_forward: 2
  hops_backward: 2
  inhibitory_closure_min_synapses: 20   # also keep inhibitory neurons with >= this many synapses both from and into the circuit (0 = off)

# --- Neuron groups -------------------------------------------------------------
# Selector keys: cell_type (list), regex (matched against cell_type), hemibrain_type (list),
# top_nt (neurotransmitter), super_class. Multiple keys are OR-ed within one group.
groups:
  # Visual projection neurons (the camera pretends to be the optic lobe feeding these)
  LC4:    {cell_type: [LC4]}         # fast looming -> Giant Fiber
  LPLC2:  {cell_type: [LPLC2]}       # looming, wide-field -> Giant Fiber
  LC16:   {cell_type: [LC16]}        # looming -> backward walking
  LC11:   {cell_type: [LC11]}        # small moving object
  LC10a:  {cell_type: [LC10a]}       # small object tracking
  LC12:   {cell_type: [LC12]}        # vertical bar
  LC15:   {cell_type: [LC15]}        # vertical bar
  # Johnston's organ (antenna). C/E groups respond to wind / static deflection.
  JO_wind: {regex: '^JO-(C|E)'}
  # Smell, taste, touch, humidity: how the fly's world reaches it
  ORN_fruit: {cell_type: [ORN_DM1, ORN_DM4, ORN_VA2, ORN_DM2]}   # fruit-ester / vinegar glomeruli (Semmelhack & Wang 2009)
  GRN_sugar: {cell_sub_class: sugar/water}                        # sugar-sensing gustatory neurons -> feeding (Shiu et al. 2024)
  BM_eye:    {cell_type: [BM_InOm]}                               # interommatidial bristles: dust on the eyes -> grooming (Seeds et al. 2014)
  BM_head:   {cell_type: [BM_Ant, BM_Fr, BM_FrOr, BM_Or, BM_Oc, BM_InOc, BM_Vt_PoOc, BM_dOcci, BM_vOcci_vPoOr, BM_dPoOr]}
  HRN_moist: {cell_type: [HRN_VP4]}                               # moist-air hygrosensory neurons
  # Descending neurons (outputs to the ventral nerve cord)
  GF:     {cell_type: [DNp01]}       # Giant Fiber: escape takeoff
  DNp09:  {cell_type: [DNp09]}       # freezing / forward walking
  MDN:    {cell_type: [MDN]}         # backward walking
  DNa01:  {cell_type: [DNa01]}       # steering
  DNa02:  {cell_type: [DNa02]}       # steering
  DNg11:  {cell_type: [DNg11]}       # front-leg grooming
  DNg12:  {regex: '^DNg12'}          # grooming
  DN_groom: {cell_type: [DNg35, DNg84, DNg15, DNge132, DNg87]}   # descending neurons with the strongest direct input from head/eye bristles (from the connectome itself)
  DNp02:  {cell_type: [DNp02]}       # wing / threat related
  DNp04:  {cell_type: [DNp04]}
  DNp11:  {cell_type: [DNp11]}
  DNp07:  {cell_type: [DNp07]}       # landing
  DNp10:  {cell_type: [DNp10]}       # landing
  # Central-brain state readouts
  pC1_social:     {cell_type: [pC1a, pC1b, pC1c]}   # female receptivity / social
  pC1_aggression: {cell_type: [pC1d, pC1e]}         # aggression
  MBON_avoid:     {cell_type: [MBON01, MBON02, MBON03, MBON05]}      # approx. Aso et al. 2014
  MBON_approach:  {cell_type: [MBON07, MBON09, MBON11, MBON12, MBON14]}
  DAN_reward:     {regex: '^PAM'}
  DAN_punish:     {regex: '^PPL1'}
  octopamine:     {top_nt: octopamine}
  DN_all:         {super_class: descending}         # the whole descending population = general motor drive
  MN_proboscis:   {cell_sub_class: [proboscis_motor_neuron, ingestion_motor_neuron]}   # feeding output

# Which groups are stimulated (inputs) and which are read out (outputs) for pruning.
inputs:  [LC4, LPLC2, LC16, LC11, LC10a, LC12, LC15, JO_wind, ORN_fruit, GRN_sugar, BM_eye, BM_head, HRN_moist]
readouts: [GF, DNp09, MDN, DNa01, DNa02, DNg11, DNg12, DNp02, DNp04, DNp11, DNp07, DNp10,
           pC1_social, pC1_aggression, MBON_avoid, MBON_approach, DAN_reward, DAN_punish, octopamine, DN_all, MN_proboscis, DN_groom]

# --- Senses -> input drive (Poisson rate in Hz per neuron, per hemifield) ------------
senses:
  max_rate_hz: 150
  camera:
    url: http://companion-cam.local:81/stream
    width: 80
    height: 60
    fps: 15
  features:                    # feature name -> {groups, gain}; rate = clip(feature*gain,0,1)*max_rate
    loom_fast:   {groups: [LC4, LPLC2], gain: 1.0}
    loom_slow:   {groups: [LC16],       gain: 1.0}
    small_object: {groups: [LC11, LC10a], gain: 1.0}
    bar:         {groups: [LC12, LC15], gain: 0.4}
  pir:
    groups: [JO_wind]
    rate_hz: 100
    burst_ms: 500
  sleep_after_s: 90            # nothing stimulating for this long -> sleep state
  wake_motion: 0.15
  vision: retina               # retina = the fly's own eyes in its 3D world (falls back to camera when no page is open)
  efference_copy_gain: 0.9     # visual drive is scaled by (1 - gain * self_motion): walking/turning/flying is not looming
  world:                       # senses posted by the world (dashboard) at ~10 Hz, each 0..1 -> Poisson drive
    odor:  {groups: [ORN_fruit], max_hz: 100, lateral: true}   # per antenna (left/right)
    sugar: {groups: [GRN_sugar], max_hz: 150}
    dust:  {groups: [BM_eye, BM_head], max_hz: 60}
    moist: {groups: [HRN_moist], max_hz: 60}

# --- Readouts -> behaviors -------------------------------------------------------------
# The brain has spontaneous activity, so every readout has a resting rate. At startup the brain
# runs with no sensory input for `calibrate_s` seconds and the mean/std of each group's rate is
# recorded (cached). Everything below is measured as a z-score against that baseline:
#   z = (rate - resting_mean) / resting_std,   score = clip(z / z_ref, 0, 1)
decode:
  window_ms: 500                 # default rate window (each behavior/channel may set its own window_ms)
  calibrate_s: 6.0               # resting baseline: run this long with no senses ...
  warmup_s: 3.0                  # ... after this long of settling (adaptation builds up over seconds)
  baseline_drift_s: 120          # slowly re-center the resting mean on the running brain (0 = fixed)
  min_std_hz: 1.0                # floor on the resting std so tiny groups don't explode
  z0: 1.0                        # dead zone: excursions below this many sigma count as nothing
  behaviors:                     # discrete states (label, robot eyes, sounds); priority wins, hold keeps it on
    escape:     {groups: [GF],  window_ms: 200,       z_ref: 8, priority: 100, min_score: 0.6, hold_ms: 800}
    backward:   {groups: [MDN],                        z_ref: 5, priority: 80,  min_score: 0.6, hold_ms: 600}
    freeze:     {groups: [DNp09],                      z_ref: 5, priority: 70,  min_score: 0.7, hold_ms: 600}
    threat:     {groups: [DNp02, DNp04, DNp11, pC1_aggression], z_ref: 5, priority: 60, min_score: 0.6, hold_ms: 600}
    groom:      {groups: [DNg11, DNg12, DN_groom],     z_ref: 4, priority: 40,  min_score: 0.6, hold_ms: 1200}
    land:       {groups: [DNp07, DNp10],               z_ref: 5, priority: 30,  min_score: 0.6, hold_ms: 600}
    social:     {groups: [pC1_social],                 z_ref: 4, priority: 20,  min_score: 0.6, hold_ms: 1500}
    feed:       {groups: [MN_proboscis],               z_ref: 4, priority: 25,  min_score: 0.6, hold_ms: 1500}
    track:      {groups: [DNa01, DNa02], window_ms: 300, z_ref: 4, priority: 10, min_score: 0.5, hold_ms: 300}
  motor:                         # continuous channels 0..1 (turn: -1..1), what actually moves the fly
    smoothing_ms: 400
    channels:
      forward:  {groups: [DN_all], window_ms: 300, z_ref: 1.2, z0: 0.0}   # descending population = walking drive
      backward: {groups: [MDN],                    z_ref: 5}
      turn:     {groups: [DNa01, DNa02], window_ms: 300, z_ref: 4, lateral: true}   # right minus left
      groom:    {groups: [DNg11, DNg12, DN_groom], z_ref: 4}
      threat:   {groups: [DNp02, DNp04, DNp11, pC1_aggression], z_ref: 5}
      song:     {groups: [pC1_social],             z_ref: 4}
      land:     {groups: [DNp07, DNp10],           z_ref: 5}
      freeze:   {groups: [DNp09],                  z_ref: 5}
      jump:     {groups: [GF], window_ms: 200,     z_ref: 8}
      feed:     {groups: [MN_proboscis],           z_ref: 4}   # proboscis extension
  modulators:
    valence:  {plus: MBON_approach, minus: MBON_avoid, z_ref: 3}   # -1..1, iris tint
    arousal:  {plus: octopamine, z_ref: 3}                          # 0..1, pupil dilation
    reward:   {plus: DAN_reward, minus: DAN_punish, z_ref: 3}
  sounds:      # behavior -> DFPlayer track number (0 = silent)
    escape: 1
    backward: 2
    groom: 3
    threat: 4
    social: 5
  volume: 20

# --- Body link -------------------------------------------------------------------------
body:
  host: companion-body.local
  port: 4210
  listen_port: 4211
  rate_hz: 20
